name: yureru
description: "Local videos, enjoyed like a music player."
publish_to: 'none'
version: 1.0.9+85
environment:
  sdk: ^3.11.4
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  file_picker: ^8.1.2
  path_provider: ^2.1.5
  shared_preferences: ^2.3.2
  uuid: ^4.5.1
  collection: ^1.19.0
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  image: ^4.10.1
  pocketbase: ^0.25.2
  nsd: ^5.0.1
  flutter_svg: ^2.3.0
  package_info_plus: ^9.0.1
  window_manager: ^0.5.2
  video_player: ^2.11.1
  video_player_pip: ^0.0.10
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/yureru_logo.png
    - assets/repeat.svg
    - assets/skip_next.svg
    - assets/skip_previous.svg
    - assets/shuffle.svg
    - assets/icons/
