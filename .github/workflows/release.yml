name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS Release
        run: flutter build macos --release

      - name: Create DMG
        run: |
          mkdir -p build/dmg_tmp
          cp -R build/macos/Build/Products/Release/Yureru.app build/dmg_tmp/
          ln -s /Applications build/dmg_tmp/Applications
          hdiutil create -volname "Yureru" -srcfolder build/dmg_tmp -ov -format UDZO build/Yureru-macos.dmg
          rm -rf build/dmg_tmp

      - name: Upload macOS build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yureru-macos
          path: build/Yureru-macos.dmg
          if-no-files-found: error

      - name: Upload macOS Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build/Yureru-macos.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Archive Windows Release
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath build\Yureru-windows-x64.zip

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yureru-windows-x64
          path: build/Yureru-windows-x64.zip
          if-no-files-found: error

      - name: Upload Windows Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build/Yureru-windows-x64.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libmpv-dev libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libavfilter-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          cache: true

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux Release
        run: flutter build linux --release

      - name: Archive Linux Release
        run: |
          tar -czvf build/Yureru-linux-x64.tar.gz -C build/linux/x64/release/bundle .

      - name: Upload Linux build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yureru-linux-x64
          path: build/Yureru-linux-x64.tar.gz
          if-no-files-found: error

      - name: Upload Linux Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build/Yureru-linux-x64.tar.gz

  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Rename Android APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/Yureru-android.apk

      - name: Upload Android build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yureru-android-apk
          path: build/Yureru-android.apk
          if-no-files-found: error

      - name: Upload Android Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build/Yureru-android.apk

  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build unsigned iOS archive
        run: flutter build ipa --release --no-codesign

      - name: Package unsigned iOS IPA
        run: |
          mkdir -p build/ios/Payload
          cp -R build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app build/ios/Payload/Runner.app
          (cd build/ios && /usr/bin/zip -qry -y Yureru-ios-unsigned.ipa Payload)

      - name: Build iOS Simulator app
        run: xcodebuild -quiet -workspace ios/Runner.xcworkspace -scheme Runner -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/ios/SimulatorDerived ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build

      - name: Archive iOS builds
        run: |
          ditto -c -k --sequesterRsrc --keepParent build/ios/archive/Runner.xcarchive build/Yureru-ios-unsigned.xcarchive.zip
          ditto -c -k --sequesterRsrc --keepParent build/ios/SimulatorDerived/Build/Products/Debug-iphonesimulator/Runner.app build/Yureru-ios-simulator-arm64.zip

      - name: Upload iOS build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Yureru-ios-unsigned
          path: |
            build/ios/Yureru-ios-unsigned.ipa
            build/Yureru-ios-unsigned.xcarchive.zip
            build/Yureru-ios-simulator-arm64.zip
          if-no-files-found: error

      - name: Upload iOS Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            build/ios/Yureru-ios-unsigned.ipa
            build/Yureru-ios-unsigned.xcarchive.zip
            build/Yureru-ios-simulator-arm64.zip
