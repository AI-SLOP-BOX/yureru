name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS Release
        run: flutter build macos --release

      - name: Create DMG
        run: |
          mkdir -p build/dmg_tmp
          cp -R build/macos/Build/Products/Release/Yureru.app build/dmg_tmp/
          ln -s /Applications build/dmg_tmp/Applications
          hdiutil create -volname "Yureru" -srcfolder build/dmg_tmp -ov -format UDZO build/Yureru-macos.dmg
          rm -rf build/dmg_tmp

      - name: Upload macOS build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yureru-macos
          path: build/Yureru-macos.dmg
          if-no-files-found: error

      - name: Upload macOS Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build/Yureru-macos.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Archive Windows Release
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath build\Yureru-windows-x64.zip

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yureru-windows-x64
          path: build/Yureru-windows-x64.zip
          if-no-files-found: error

      - name: Upload Windows Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build/Yureru-windows-x64.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libjson-glib-dev libmpv-dev libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libavfilter-dev

      - name: Install Flatpak build tools
        run: sudo apt-get install -y flatpak flatpak-builder

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          cache: true

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux Release
        run: flutter build linux --release

      - name: Include Linux package license texts
        run: |
          flutter_root="$(dirname "$(dirname "$(readlink -f "$(command -v flutter)")")")"
          python3 tools/collect_linux_licenses.py --bundle build/linux/x64/release/bundle --flutter-root "$flutter_root"

      - name: Archive Linux Release
        run: |
          tar -czvf build/yureru-linux-x64.tar.gz -C build/linux/x64/release/bundle .

      - name: Build cross-distro Flatpak
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive -y flathub org.freedesktop.Platform//26.08 org.freedesktop.Sdk//26.08
          rm -rf packaging/flatpak/bundle build/flatpak
          cp -R build/linux/x64/release/bundle packaging/flatpak/bundle
          flatpak-builder --user --force-clean --disable-rofiles-fuse --default-branch=stable --repo=build/flatpak/repo build/flatpak/app packaging/flatpak/dev.yureru.yureru.yml
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo build/flatpak/repo build/yureru-linux-x86_64.flatpak dev.yureru.yureru stable

      - name: Prepare version-pinned Homebrew formula
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 tools/render_homebrew_formula.py --version "${GITHUB_REF_NAME#v}" --archive build/yureru-linux-x64.tar.gz --output build/yureru.rb

      - name: Upload Linux build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yureru-linux-x64
          path: |
            build/yureru-linux-x64.tar.gz
            build/yureru-linux-x86_64.flatpak
          if-no-files-found: error

      - name: Upload version-pinned Homebrew formula artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: Yureru-homebrew-formula
          path: build/yureru.rb
          if-no-files-found: error

      - name: Upload Linux Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            build/yureru-linux-x64.tar.gz
            build/yureru-linux-x86_64.flatpak
            build/yureru.rb

  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Rename Android APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/Yureru-android.apk

      - name: Upload Android build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yureru-android-apk
          path: build/Yureru-android.apk
          if-no-files-found: error

      - name: Upload Android Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build/Yureru-android.apk

  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build unsigned iOS archive
        run: flutter build ipa --release --no-codesign

      - name: Package unsigned iOS IPA
        run: |
          mkdir -p build/ios/Payload
          cp -R build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app build/ios/Payload/Runner.app
          (cd build/ios && /usr/bin/zip -qry -y Yureru-ios-unsigned.ipa Payload)

      - name: Build iOS Simulator app
        run: xcodebuild -quiet -workspace ios/Runner.xcworkspace -scheme Runner -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/ios/SimulatorDerived ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build

      - name: Archive iOS builds
        run: |
          ditto -c -k --sequesterRsrc --keepParent build/ios/archive/Runner.xcarchive build/Yureru-ios-unsigned.xcarchive.zip
          ditto -c -k --sequesterRsrc --keepParent build/ios/SimulatorDerived/Build/Products/Debug-iphonesimulator/Runner.app build/Yureru-ios-simulator-arm64.zip

      - name: Upload iOS build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Yureru-ios-unsigned
          path: |
            build/ios/Yureru-ios-unsigned.ipa
            build/Yureru-ios-unsigned.xcarchive.zip
            build/Yureru-ios-simulator-arm64.zip
          if-no-files-found: error

      - name: Upload iOS Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            build/ios/Yureru-ios-unsigned.ipa
            build/Yureru-ios-unsigned.xcarchive.zip
            build/Yureru-ios-simulator-arm64.zip
